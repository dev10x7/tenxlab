services:
  postgres:
    image: postgres:16-alpine
    container_name: tenxlab-postgres
    environment:
      POSTGRES_USER: tenxlab
      POSTGRES_PASSWORD: tenxlab
      POSTGRES_DB: tenxlab
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tenxlab']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tenxlab-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tenxlab-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: tenxlab
      MINIO_ROOT_PASSWORD: tenxlab123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 tenxlab tenxlab123; do sleep 1; done;
      mc mb --ignore-existing local/tenxlab-submissions;
      mc mb --ignore-existing local/tenxlab-recordings;
      echo 'MinIO buckets ready';
      "
