name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node — build, test, typecheck, license gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build --workspaces --if-present
      - name: Test
        run: npm run test --workspaces --if-present
      - name: License gate (deny copyleft)
        run: node scripts/check-licenses.mjs
      - name: SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: ignore

  python:
    name: Python — AI plane tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Test
        run: pytest -q
      - name: License gate (deny copyleft)
        run: |
          pip install pip-licenses
          pip-licenses --format=markdown --with-license-file > licenses.md || true
          if grep -Ei 'AGPL|GNU General Public License v3|GNU General Public License v2' licenses.md; then
            echo "Copyleft license detected in Python dependencies"; exit 1;
          fi
          echo "Python license gate passed"
