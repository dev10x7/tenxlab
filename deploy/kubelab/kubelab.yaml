# KubeLab execution plane, adapted for a local minikube cluster.
#
# Upstream manifests (github.com/natrontech/kubelab, deploy/) assume a
# production cluster: a 16Gi/4-CPU request, a `hostpath-node=true` node
# selector, a hand-created hostPath PersistentVolume, and an `nginx-external`
# ingress class. None of those exist on minikube, so this overlay trims the
# request, drops the node selector, uses the default `standard` storage class,
# and points the agent ingress at minikube's `nginx` class.
#
# This is the real KubeLab backend (the same image production runs), not a
# stub. Create the admin account the API authenticates as once, after the pod
# is up:
#
#   kubectl port-forward -n kubelab svc/kubelab-service 8090:8090 &
#   # then POST /api/admins with an email/password matching KUBELAB_ADMIN_*.
apiVersion: v1
kind: Namespace
metadata:
  name: kubelab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubelab-admin
  namespace: kubelab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubelab-admin
subjects:
  - kind: ServiceAccount
    name: kubelab-admin
    namespace: kubelab
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubelab-config
  namespace: kubelab
data:
  KUBELAB_AGENT_IMAGE: ghcr.io/natrontech/kubelab-agent:latest
  CODE_SERVER_IMAGE: ghcr.io/natrontech/kubelab-code-server:latest
  # Wildcard base for per-exercise code-server ingress hosts. nip.io resolves
  # any *.192.168.49.2.nip.io name to the minikube node, so the browser reaches
  # the ingress without /etc/hosts edits.
  ALLOWED_HOSTS: 192.168.49.2.nip.io
  PODS_LIMIT: "40"
  STORAGE_LIMIT: "10Gi"
  AGENT_INGRESS_CLASS: nginx
  VCLUSTER_CHART_VERSION: "0.16.4"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubelab-pb-data
  namespace: kubelab
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubelab
  namespace: kubelab
spec:
  serviceName: kubelab-service
  replicas: 1
  selector:
    matchLabels:
      app: kubelab
  template:
    metadata:
      labels:
        app: kubelab
    spec:
      serviceAccountName: kubelab-admin
      containers:
        - name: kubelab
          image: ghcr.io/natrontech/kubelab:latest
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: kubelab-config
          volumeMounts:
            - name: pb-data
              mountPath: /app/kubelab/pb_data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "2"
      volumes:
        - name: pb-data
          persistentVolumeClaim:
            claimName: kubelab-pb-data
---
apiVersion: v1
kind: Service
metadata:
  name: kubelab-service
  namespace: kubelab
spec:
  selector:
    app: kubelab
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
---
# Browser entry point. The LMS links here with a signed launch token; the UI
# resolves the lab, flips clusterRunning=true, and shows the code-server IDE.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubelab-ui
  namespace: kubelab
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  rules:
    - host: kubelab.192.168.49.2.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubelab-service
                port:
                  number: 8090
